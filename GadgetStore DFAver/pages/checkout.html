<!doctype html>
<html lang="ja">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>購入手続き | Gadget Store</title>
		<link rel="stylesheet" href="../css/style.css" />
	</head>
	<body>
		<header>
			<div class="header-inner">
				<h1 class="logo">Gadget Store</h1>
				<nav>
					<a href="../index.html">ホーム</a>
					<a href="products.html">商品一覧</a>
					<a href="cart.html">カート</a>
				</nav>
			</div>
		</header>

		<main class="checkout-page">
			<h2>ORDER CONFIRMATION</h2>
			<p class="page-description">ご注文内容をご確認ください。</p>

			<section class="checkout-section">
				<h3>注文商品</h3>
				<div id="checkout-items"></div>
			</section>

			<section class="checkout-section">
				<h3>注文内容</h3>
				<div class="checkout-total">
					<span>商品合計</span>
					<strong id="checkout-total">¥0</strong>
				</div>
			</section>

			<p id="checkout-message"></p>

			<div class="checkout-buttons">
				<a href="cart.html" class="back-button">カートに戻る</a>
				<button id="order-button" class="btn">注文を確定する</button>
			</div>
		</main>

		<footer>
			<p>&copy; 2026 MOCHI</p>
		</footer>
		<script src="../js/mode.js"></script>
		<script src="../js/products.js"></script>
		<script src="../js/checkout.js"></script>
	</body>
</html>
